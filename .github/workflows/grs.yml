name: Update GitHub Profile

on:
  schedule:
    # 03:00 UTC = 08:30 IST
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      # ============================================================
      # Fetch GitHub contribution data
      #
      # Output:
      #   data/contributions.json
      # ============================================================

      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: Maulik557-png
        run: |
          python scripts/fetch_contributions.py

      # ============================================================
      # Generate contribution heatmap
      #
      # Output:
      #   assets/heatmaps/Maulik-heatmap.svg
      # ============================================================

      - name: Generate contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      # ============================================================
      # Generate activity graph
      #
      # Output:
      #   assets/graphs/Maulik-activity-graph.svg
      # ============================================================

      - name: Generate activity graph
        run: |
          python scripts/render_activity_graph_svg.py

      # ============================================================
      # Generate GitHub stats card
      #
      # Output:
      #   profile/stats.svg
      # ============================================================

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Maulik557-png&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Generate top languages card
      #
      # Output:
      #   profile/top-langs.svg
      # ============================================================

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Maulik557-png&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Commit only when generated files changed
      # ============================================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/contributions.json \
            assets/heatmaps/Maulik-heatmap.svg \
            assets/graphs/Maulik-activity-graph.svg \
            profile/stats.svg \
            profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi

          git commit -m "chore: update GitHub profile data"
          git push
