<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" tabindex="0">
  <style>
    .pm-outer, .pm-inner, .pm-accent {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      will-change: transform, opacity, filter;
    }

    /* Body: deep pulsing scale + neon glow flash */
    .pm-outer {
      animation: pm-pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pm-pulse-glow {
      0%, 100% {
        transform: scale(0.85);
        filter: drop-shadow(0 0 2px rgba(243, 112, 54, 0.35));
      }
      50% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 26px rgba(243, 112, 54, 0.95))
                drop-shadow(0 0 46px rgba(243, 112, 54, 0.5));
      }
    }

    /* Inner mark: full 360 spin with a sharp tilt-and-shrink at the midpoint */
    .pm-inner {
      animation: pm-spin-tilt 2.2s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }
    @keyframes pm-spin-tilt {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(0.82);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    /* Accent fleck: sharp opacity + scale flash, offset from the other two loops */
    .pm-accent {
      animation: pm-flash 1.4s ease-in-out infinite;
      animation-delay: 0.3s;
    }
    @keyframes pm-flash {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.6);
      }
      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    /* Speed everything up on hover/focus for an energetic response */
    svg:hover .pm-outer,
    svg:focus .pm-outer { animation-duration: 1s; }
    svg:hover .pm-inner,
    svg:focus .pm-inner { animation-duration: 1s; }
    svg:hover .pm-accent,
    svg:focus .pm-accent { animation-duration: 0.7s; }

    @media (prefers-reduced-motion: reduce) {
      .pm-outer, .pm-inner, .pm-accent {
        animation: none;
      }
    }
  </style>
