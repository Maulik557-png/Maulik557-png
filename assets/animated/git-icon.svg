<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="git-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .git-rock {
      transform-box: view-box;
      transform-origin: 256px 256px;
      animation: git-rock 2s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes git-rock {
      0%   { transform: rotate(0deg)    scale(1); }
      22%  { transform: rotate(-4.5deg) scale(1.015); }
      50%  { transform: rotate(0.5deg)  scale(1); }
      74%  { transform: rotate(3.5deg)  scale(1.01); }
      100% { transform: rotate(0deg)    scale(1); }
    }

    .git-branch {
      fill: none;
      stroke: #FFFFFF;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 27;
      filter: url(#git-glow);
    }
    .git-branch-top  { stroke-dasharray: 15 12; animation: git-flow 1.5s linear infinite; }
    .git-branch-vert { stroke-dasharray: 15 12; animation: git-flow 1.5s linear infinite 0.15s; }
    .git-branch-diag { stroke-dasharray: 15 12; animation: git-flow 1.5s linear infinite 0.3s; }
    @keyframes git-flow {
      0%   { stroke-dashoffset: 108; }
      100% { stroke-dashoffset: 0; }
    }

    .git-node {
      fill: #FFFFFF;
      filter: url(#git-glow);
      animation: git-pulse 1.8s cubic-bezier(.36,.07,.19,.97) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .git-node-a { animation-delay: 0s; }
    .git-node-b { animation-delay: 0.6s; }
    .git-node-c { animation-delay: 1.2s; }
    @keyframes git-pulse {
      0%   { transform: scale(0.72); opacity: 0.55; }
      30%  { transform: scale(1.3);  opacity: 1; }
      55%  { transform: scale(0.95); opacity: 1; }
      100% { transform: scale(0.72); opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .git-rock, .git-branch-top, .git-branch-vert, .git-branch-diag, .git-node {
        animation: none !important;
      }
    }
  </style>

  <g class="git-rock">
    <!-- Branching data-flow lines (glow behind the orange mark, revealed through its cut-out channels) -->
    <path class="git-branch git-branch-top"  d="M208,58 L257,153.5" />
    <path class="git-branch git-branch-vert" d="M257,153.5 L257,364" />
    <path class="git-branch git-branch-diag" d="M257,153.5 L362,258.5" />

    <!-- Pulsing commit nodes, staggered -->
    <circle class="git-node git-node-a" cx="257" cy="153.5" r="37" />
    <circle class="git-node git-node-b" cx="257" cy="364"   r="37" />
    <circle class="git-node git-node-c" cx="362" cy="258.5" r="37" />

